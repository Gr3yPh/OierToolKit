name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步到镜像站的 Release tag'
        required: true

jobs:
  build:
    name: Build for ${{ matrix.os }}_${{ matrix.arch }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
            target: otk-linux-amd64
          - os: linux
            arch: arm64
            ext: ''
            target: otk-linux-arm64
          - os: windows
            arch: amd64
            ext: .exe
            target: otk-windows-amd64.exe
          - os: darwin
            arch: amd64
            ext: ''
            target: otk-darwin-amd64
          - os: darwin
            arch: arm64
            ext: ''
            target: otk-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -ldflags="-s -w -X main.otkVersion=${{ github.ref_name }}" -o ${{ matrix.target }} .

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          chmod +x ${{ matrix.target }}
          tar -czf ${{ matrix.target }}.tar.gz ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.os == 'windows'
        run: |
          zip ${{ matrix.target }}.zip ${{ matrix.target }}

      - name: Upload artifact (non-Windows)
        if: matrix.os != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}.tar.gz
          path: ${{ matrix.target }}.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}.zip
          path: ${{ matrix.target }}.zip

  release:
    name: Create Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Changelog for this version
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD)
          fi
          echo "$CHANGELOG" > changelog.txt
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ### 更新日志

            ${{ steps.changelog.outputs.changelog }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync:
    name: Sync Release to Mirror
    needs: [build, release]
    # 推 tag：发布成功后自动同步；手动触发：直接同步指定 tag（补同步用）
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MIRROR_URL: ${{ secrets.MIRROR_UPLOAD_URL }}
      MIRROR_TOKEN: ${{ secrets.MIRROR_UPLOAD_TOKEN }}
    steps:
      - name: Prepare runner (install jq)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Download release assets via GitHub API
        run: |
          set -euo pipefail
          mkdir -p downloads
          echo "Fetching release metadata for $REPO tag $TAG"
          release_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                            -H "Accept: application/vnd.github+json" \
                            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          # If tag not found, API returns message key
          if echo "$release_json" | jq -e 'has("message") and .message == "Not Found"' >/dev/null 2>&1; then
            echo "Release with tag $TAG not found."
            echo "API response:"
            echo "$release_json"
            exit 1
          fi
          assets_count=$(echo "$release_json" | jq '.assets | length')
          echo "Assets count: $assets_count"
          if [ "$assets_count" -eq 0 ]; then
            echo "No assets found for release $TAG"
            exit 1
          fi
          for i in $(seq 0 $((assets_count-1))); do
            asset_url=$(echo "$release_json" | jq -r ".assets[$i].url")
            asset_name=$(echo "$release_json" | jq -r ".assets[$i].name")
            echo "Downloading asset #$i : $asset_name"
            # asset_url is the API asset url; must use Accept: application/octet-stream to get binary
            curl -L -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "Accept: application/octet-stream" \
                 "$asset_url" -o "downloads/$asset_name"
            echo "Saved downloads/$asset_name"
          done
          echo "Downloaded files:"
          ls -lah downloads || true

      - name: Upload each file to mirror via HTTP
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_URL:-}" ] || [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "MIRROR_UPLOAD_URL or MIRROR_UPLOAD_TOKEN not set in repository secrets"
            exit 1
          fi
          cd downloads
          for f in *; do
            [ -e "$f" ] || continue
            echo "Uploading $f ..."
            # Use curl to POST file; capture body and HTTP status
            resp=$(curl -s -w "\n%{http_code}" -H "X-UPLOAD-TOKEN: $MIRROR_TOKEN" -F "file=@$f" "$MIRROR_URL")
            body=$(echo "$resp" | sed '$d')
            code=$(echo "$resp" | tail -n1)
            echo "Response code: $code"
            echo "Body: $body"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "Upload failed for $f (HTTP $code)"
              exit 1
            fi
          done
