name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步到镜像站的 Release tag'
        required: true

jobs:
  build:
    name: Build for ${{ matrix.os }}_${{ matrix.arch }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      # 一个平台失败不要取消其余平台，日志能一次看全
      fail-fast: false
      matrix:
        include:
          # GUI（Fyne）需要 cgo，不能交叉编译，每个平台用原生 runner
          - os: linux
            arch: amd64
            ext: ''
            target: otk-linux-amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            ext: ''
            target: otk-linux-arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: amd64
            ext: .exe
            target: otk-windows-amd64.exe
            runner: windows-latest
          # macos-13（Intel runner）已退役，amd64 版改在 Apple Silicon 上
          # 用 clang -arch x86_64 交叉编译（SDK 自带 x86_64 切片）
          - os: darwin
            arch: amd64
            ext: ''
            target: otk-darwin-amd64
            runner: macos-latest
            cc: 'clang -arch x86_64'
          - os: darwin
            arch: arm64
            ext: ''
            target: otk-darwin-arm64
            runner: macos-latest
            cc: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install GUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          # Fyne 的 glfw 在 Linux 上同时编 X11 与 Wayland 两个后端，
          # 缺 libwayland-dev 会报 wayland-client-core.h: No such file or directory。
          sudo apt-get install -y gcc libgl1-mesa-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libxkbcommon-dev xorg-dev libwayland-dev

      - name: Generate Windows resources (icon + version info)
        if: runner.os == 'Windows'
        run: |
          # 从 versioninfo.json 生成 .syso；go build 会自动链接它，
          # 这样 exe 在资源管理器里才有图标与文件属性。
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest -o resource_windows_amd64.syso versioninfo.json

      - name: Build binary (Linux/macOS)
        if: matrix.os != 'windows'
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
          # darwin/amd64 在 arm64 runner 上交叉编译；空值时 go 用默认编译器
          CC: ${{ matrix.cc }}
        run: |
          go build -ldflags="-s -w -X main.otkVersion=${{ github.ref_name }}" -o ${{ matrix.target }} .
          cp ${{ matrix.target }} otk-gui

      # Windows 要编两份，因为子系统是构建期决定的：
      #   - 命令行版必须是 console 子系统，否则双击后敲不了命令、输出也没处去；
      #   - 图形版必须是 windows 子系统，否则双击会先弹一个黑框。
      # 两份都带上 resource_windows_amd64.syso（图标 + 版本信息）：它的 .rsrc
      # 段不会覆盖 -H windowsgui，实测 Subsystem 与资源段都正确。
      - name: Build binaries (Windows)
        if: matrix.os == 'windows'
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
        shell: bash
        run: |
          VER='${{ github.ref_name }}'
          go build -ldflags="-s -w -H windowsgui -X main.otkVersion=${VER}" -o otk-gui.exe .
          go build -ldflags="-s -w -X main.otkVersion=${VER}" -o ${{ matrix.target }} .

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          chmod +x ${{ matrix.target }} otk-gui
          # 压缩包里只有 otk 与 otk-gui 两个文件，与 Windows 的 zip 保持一致
          tar -czf ${{ matrix.target }}.tar.gz ${{ matrix.target }} otk-gui

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # windows runner 没有 zip 命令，用 PowerShell 自带的 Compress-Archive
          Compress-Archive -Path '${{ matrix.target }}','otk-gui.exe' -DestinationPath '${{ matrix.target }}.zip' -Force

      - name: Upload artifact (non-Windows)
        if: matrix.os != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}.tar.gz
          path: ${{ matrix.target }}.tar.gz

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}.zip
          path: ${{ matrix.target }}.zip

  release:
    name: Create Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # 新仓库的 GITHUB_TOKEN 默认只读，创建 Release 与传附件需要 contents:write
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Changelog for this version
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD)
          fi
          echo "$CHANGELOG" > changelog.txt
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ### 更新日志

            ${{ steps.changelog.outputs.changelog }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync:
    name: Sync Release to Mirror
    needs: [build, release]
    # 推 tag：发布成功后自动同步；手动触发：直接同步指定 tag（补同步用）
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MIRROR_URL: ${{ secrets.MIRROR_UPLOAD_URL }}
      MIRROR_TOKEN: ${{ secrets.MIRROR_UPLOAD_TOKEN }}
    steps:
      - name: Prepare runner (install jq)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Download release assets via GitHub API
        run: |
          set -euo pipefail
          mkdir -p downloads
          echo "Fetching release metadata for $REPO tag $TAG"
          release_json=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                            -H "Accept: application/vnd.github+json" \
                            "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          # If tag not found, API returns message key
          if echo "$release_json" | jq -e 'has("message") and .message == "Not Found"' >/dev/null 2>&1; then
            echo "Release with tag $TAG not found."
            echo "API response:"
            echo "$release_json"
            exit 1
          fi
          assets_count=$(echo "$release_json" | jq '.assets | length')
          echo "Assets count: $assets_count"
          if [ "$assets_count" -eq 0 ]; then
            echo "No assets found for release $TAG"
            exit 1
          fi
          for i in $(seq 0 $((assets_count-1))); do
            asset_url=$(echo "$release_json" | jq -r ".assets[$i].url")
            asset_name=$(echo "$release_json" | jq -r ".assets[$i].name")
            echo "Downloading asset #$i : $asset_name"
            # asset_url is the API asset url; must use Accept: application/octet-stream to get binary
            curl -L -sS -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "Accept: application/octet-stream" \
                 "$asset_url" -o "downloads/$asset_name"
            echo "Saved downloads/$asset_name"
          done
          echo "Downloaded files:"
          ls -lah downloads || true

      - name: Upload each file to mirror via HTTP
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_URL:-}" ] || [ -z "${MIRROR_TOKEN:-}" ]; then
            echo "MIRROR_UPLOAD_URL or MIRROR_UPLOAD_TOKEN not set in repository secrets"
            exit 1
          fi
          cd downloads
          for f in *; do
            [ -e "$f" ] || continue
            echo "Uploading $f ..."
            # Use curl to POST file; capture body and HTTP status
            resp=$(curl -s -w "\n%{http_code}" -H "X-UPLOAD-TOKEN: $MIRROR_TOKEN" -F "file=@$f" "$MIRROR_URL")
            body=$(echo "$resp" | sed '$d')
            code=$(echo "$resp" | tail -n1)
            echo "Response code: $code"
            echo "Body: $body"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "Upload failed for $f (HTTP $code)"
              exit 1
            fi
          done
